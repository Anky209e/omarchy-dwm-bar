name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python sensor, worker and artwork regressions
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Layout, theme contrast and parser regressions
        run: |
          node tests/bar.test.js
          node tests/colors.test.js
          node tests/parsers.test.js
